<div class="app-pdf-viewer">
  <div class="pdf-header">
    <h1 class="pdf-title">Plan-Sync - Visor de Documentos</h1>
    <div class="pdf-controls">
      <div class="zoom-controls">
        <button (click)="zoomOut()" title="Alejar" [disabled]="currentZoom <= minZoom">−</button>
        <span class="zoom-level">{{ (currentZoom * 100).toFixed(0) }}%</span>
        <button (click)="zoomIn()" title="Acercar" [disabled]="currentZoom >= maxZoom">+</button>
      </div>
    </div>
  </div>
  
<div class="pdf-viewer-container">
  <!-- canvas SIEMPRE presente -->
  <div class="pdf-canvas-wrapper">
    <canvas #myCanvas></canvas>
  </div>

  <!-- overlays -->
  <div *ngIf="isLoading" class="loading-state overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Cargando documento...</div>
  </div>

  <div *ngIf="!isLoading && !hasDocument" class="empty-state overlay">
    <div class="empty-icon">📄</div>
    <div class="empty-title">Documento de Muestra</div>
    <div class="empty-description">
      Se está cargando un documento PDF de prueba. En la versión completa podrás cargar tus propios archivos.
    </div>
  </div>
</div>

</div>
