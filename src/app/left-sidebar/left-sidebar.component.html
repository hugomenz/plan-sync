<div class="sidebar" [class.collapsed]="!sidebarVisible">
  <div class="sidebar-header">
    <h2>Anotaciones</h2>
    <button
      (click)="toggleSidebar()"
      class="toggle-button"
      [class.collapsed]="!sidebarVisible"
      [title]="sidebarVisible ? 'Ocultar panel' : 'Mostrar panel'"
    >
      {{ sidebarVisible ? "✕" : "☰" }}
    </button>
  </div>
  
  <div class="sidebar-content">
    <ul class="annotations-list" *ngIf="drawingAnnotationService.annotations.length > 0; else emptyState">
      <li
        *ngFor="let annotation of drawingAnnotationService.annotations; trackBy: trackByAnnotation"
        (click)="drawingAnnotationService.highlightAnnotation(annotation)"
        class="annotation-item"
        [class.active]="selectedAnnotation === annotation"
      >
        <div class="annotation-info">
          <div class="annotation-name">{{ annotation.name }}</div>
          <div class="annotation-details">
            Grosor: {{ annotation.thickness }}px
          </div>
        </div>
        <span 
          class="annotation-color"
          [style.background-color]="annotation.color"
          [title]="'Color: ' + annotation.color"
        ></span>
      </li>
    </ul>
    
    <ng-template #emptyState>
      <div class="empty-state">
        <div class="empty-icon">📝</div>
        <div class="empty-title">Sin anotaciones</div>
        <div class="empty-description">
          Crea tu primera anotación usando las herramientas del panel derecho
        </div>
      </div>
    </ng-template>
  </div>
</div>
