<app-toolbar
  (documentSelected)="onDocumentSelected($event)"
  (exportRequested)="onExportRequested($event)"
></app-toolbar>

<div class="main-content">
  <app-left-sidebar
    [ngClass]="{ 'sidebar-collapsed': !leftSidebarVisible }"
    (sidebarVisibilityChanged)="handleSidebarVisibilityChange('left', $event)"
  ></app-left-sidebar>

  <app-pdf-viewer class="pdf-viewer"></app-pdf-viewer>

  <app-right-sidebar class="right-sidebar"></app-right-sidebar>
</div>
